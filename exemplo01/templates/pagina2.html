{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Página 2 - Lista de Pessoas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <p>bdpratico\exemplo01\templates\pagina2.html</p>
        <h1 class="h2">Lista de Pessoas</h1>
        <table class="table table-striped table-hover">
            <thead>
                <tr>
                    <th>Nome</th>
                    <th>eMail</th>
                    <th>Celular</th>
                    <th>Função</th>
                </tr>
            </thead>
            <tbody>
                {% for regs in pessoas %}
                <tr>
                    <td>{{ regs.nome }}</td>
                    <td>{{ regs.email }}</td>
                    <td>{{ regs.celular }}</td>
                    <td>{{ regs.funcao }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
