{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Excluir Pessoas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="col-md-12 col-sm-12 col-xs-12">
            <center>
                <p>bdpratico\exemplo01\templates\exemplo01\pessoa_confirm_delete.html</p>
                <img src="{% static 'pessoa.png' %}" class="img-fluid" alt="Teste" width="15%">
                <form method="POST">
                    {% csrf_token %}
                    <p>{{ object.nome }}</p>
                    <button type="submit" class="btn btn-danger">Sim, exclua!</button> &nbsp;
                    <a href="{% url 'menu_alias' %}" class="btn btn-secondary">Cancelar</a>
                </form>
            </center>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
