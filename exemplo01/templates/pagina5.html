{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Página 5 - Cadastro de Pessoa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <div class="col-md-12 col-sm-12 col-xs-12">
            <center>
                <p>bdpratico\exemplo01\templates\pagina5.html</p>
                <img src="{% static 'pessoa.png' %}" class="img-fluid" alt="Teste" width="15%">
                <br>
                <form method="POST" enctype="multipart/form-data">
                    {% csrf_token %}
                    <div class="col-md-12 col-sm-12 col-xs-12">
                        <br>
                        <div class="row" style="line-height: 1;">
                            <div class="col-md-1 col-sm-1 col-xs-1"></div>
                            <div class="col-md-8 col-sm-12 col-xs-12">
                                <label for="nome">Nome</label>
                                <input type="text" name="nome" id="nome" class="form-control" 
                                    placeholder="Digite o nome da pessoa">
                            </div>
                        </div>
                        <br>
                        <div class="row" style="line-height: 1;">
                            <div class="col-md-1 col-sm-1 col-xs-1"></div>
                            <div class="col-md-8 col-sm-12 col-xs-12">
                                <label for="email">eMail</label>
                                <input type="text" name="email" id="email" class="form-control" placeholder="Digite o eMail da pessoa">
                            </div>
                        </div>
                        <br>
                        <div class="row" style="line-height: 1;">
                            <div class="col-md-1 col-sm-1 col-xs-1"></div>
                            <div class="col-md-4 col-sm-4 col-xs-4">
                                <label for="celular">Celular</label>
                                <input type="text" name="celular" id="celular" class="form-control" placeholder="Digite o celular">
                            </div>
                            <div class="col-md-4 col-sm-4 col-xs-4">
                                <label for="funcao">Função</label>
                                <input type="text" name="funcao" id="funcao" class="form-control" placeholder="Digite a função">
                            </div>
                        </div>
                        <br>
                        <div class="row" style="line-height: 1;">
                            <div class="col-md-1 col-sm-1 col-xs-1"></div>
                            <div class="col-md-4 col-sm-4 col-xs-4">
                                <label for="nascimento">Nascimento</label>
                                <input type="date" name="nascimento" id="nascimento" class="form-control">
                            </div>
                            <div class="col-md-1 col-sm-1 col-xs-1"><br><br>
                                <label for="ativo">Ativo</label>
                                <input type="checkbox" name="ativo" id="ativo">
                            </div>
                            <div class="col-md-1 col-sm-1 col-xs-1"><br>
                                <button type="submit" class="btn btn-primary">Salvar</button>
                            </div>
                        </div>
                    </div>
                </form>
            </center>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
